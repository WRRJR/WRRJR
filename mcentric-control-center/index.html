<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCENTRIC Compliance & Governance Center</title><style>*{box-sizing:border-box}body{margin:0;background:#070b11;color:#f5f7fb;font:14px Inter,system-ui,sans-serif}button,input,textarea{font:inherit}.gold{color:#e8b94f}.muted{color:#95a3b6;font-size:12px}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(450px,94vw);background:#101722;border:1px solid #2a394f;border-radius:16px;padding:28px}.login input,.login button{width:100%;padding:12px;margin-top:10px;border-radius:9px}.login input{background:#090e15;color:#fff;border:1px solid #35455e}.primary{background:#e8b94f!important;color:#111!important;border-color:#e8b94f!important;font-weight:850}.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{border-right:1px solid #26354a;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-weight:950;letter-spacing:.15em}.brand small{display:block;color:#e8b94f;font-size:9px;margin-top:4px}.entity{margin:22px 0}.nav{display:grid;gap:7px}.nav a{padding:11px 12px;color:#9eabbc;text-decoration:none;border:1px solid transparent;border-radius:9px}.nav a:hover,.nav a.on{color:#fff;background:#141c28;border-color:#33455e}.who{position:absolute;bottom:18px}.main{padding:28px 32px;max-width:1480px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.panel{background:#101722;border:1px solid #29384e;border-radius:11px}.metric{padding:14px}.metric b{display:block;font-size:27px;margin-top:4px}.list{display:grid;gap:9px}.task{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:13px 14px;cursor:pointer}.bar{height:42px;border-radius:5px;background:#f1a84d}.bar.crit{background:#ff5f6b}.task h3{margin:0 0 4px;font-size:14px}.badge,.mode,.lane{font-size:9px;border:1px solid #3b4d67;border-radius:999px;padding:4px 7px}.lane{color:#e8b94f;margin-right:6px}.mode{color:#d8e2f1;margin-left:6px}.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.doc{padding:14px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button,.actions a{padding:8px 10px;border:1px solid #38506d;background:#142032;color:#fff;border-radius:8px;text-decoration:none;cursor:pointer}.cancel{background:#2a313d!important}.modalbg{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(900px,96vw);max-height:90vh;overflow:auto;padding:22px}.goal{padding:12px;border:1px solid #425673;border-radius:9px;margin:12px 0}.req{display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid #273448;padding:11px 0}.close{float:right;background:none;border:0;color:#fff;font-size:20px}.meetingform{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.meetingform label{font-size:11px;color:#9eabbc}.meetingform input,.meetingform textarea{width:100%;padding:9px;background:#090e15;color:#fff;border:1px solid #34455e;border-radius:7px}.wide{grid-column:1/-1}.meet{padding:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.empty{padding:24px;border:1px dashed #3a4a61;border-radius:10px;color:#93a0b1;text-align:center}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{display:flex;overflow:auto}.who{position:static;margin-top:12px}.metrics{grid-template-columns:repeat(2,1fr)}.docs{grid-template-columns:1fr}}@media(max-width:560px){.main{padding:18px}.metrics{grid-template-columns:1fr}.meetingform{grid-template-columns:1fr}.wide{grid-column:1}.task{grid-template-columns:6px 1fr}.task .badge{grid-column:2}.req{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const USERS={bill:'Bill',jeff:'Jeff'},PASS='mission';const SHEET='https://docs.google.com/spreadsheets/d/1AhWloWZJb9qPwg9w476UJjQn_aKsIL023E9oi-yZjbw/edit';const F={master:'https://drive.google.com/drive/folders/1fGsxn79niCTpLWO9ExljWmKC7Bga9NLq',tech:'https://drive.google.com/drive/folders/1h8AMkLvxOs95wUpvRTRU4-fqXVvribFQ',foundation:'https://drive.google.com/drive/folders/1qw-bjrHzA1GDiCuCQTlQ9Jpy1ewu_2uT',ip:'https://drive.google.com/drive/folders/1mQ3zpRMqxS9fKmTH6ObTuUeyAFkthsRr',product:'https://drive.google.com/drive/folders/1dbPFm75KKp14bFoenbkIOin7IEktS9F8',pilot:'https://drive.google.com/drive/folders/1VEwE24vmKotjsV_4unV2JbWLcn2Yvz4_',funding:'https://drive.google.com/drive/folders/1s5y-u2lwTfwQVj6iRJTLMOpcknz0ENr7',finance:'https://drive.google.com/drive/folders/1Imr4jUrDhUFrRnK77JprZSrwQHSpD8qM',meet:'https://drive.google.com/drive/folders/1Q8o_qAQOoXGiRAstsri8tm9aCX0g1UxD'};const T=[['M1','Entity Structure & Formation Decisions','Bill','Jeff','Days 1–30','In Progress','BOTH','ALREADY DRAFTED / NEEDS APPROVAL','Convert approved architecture into attorney/CPA formation instructions; lock names, states, ownership and board model.'],['M2','Technologies Corporate Book & Filings','Jeff','Bill','Days 1–60','Not Started','TECH','NEEDS FORMATION / FILING','Form Technologies; obtain EIN; governing actions; cap table/equity; banking/accounting records.'],['M3','Foundation Corporate, Governance & 501(c)(3) File','Bill','Jeff','Days 1–60','Not Started','FOUNDATION','NEEDS FORMATION / FILING','Define charitable activities and independent governance; form nonprofit; EIN; bylaws; board; Form 1023 path.'],['M4','Separate Banking, Accounting & Financial Controls','Jeff','Bill','Days 31–60','Not Started','BOTH','BLOCKED BY FORMATION','After formation establish separate bank accounts, ledgers, budgets, charts of accounts and authorization rules.'],['M5','IP, Brand & Chain of Title','Bill','Jeff','Days 1–60','In Progress','TECH','NEEDS EVIDENCE ASSEMBLY / COUNSEL REVIEW','Assemble GitHub, domains, designs, logos, developer history and assignments; cure chain-of-title gaps.'],['M6','Related-Party & Intercompany Controls','Jeff','Bill','Days 1–60','In Progress','BOTH','NEEDS POLICY / COUNSEL-CPA REVIEW','Create relationship map, transaction policy/register, pricing support, recusals and contract/invoice controls before money moves.'],['M7','Product & Validation Dossier','Bill','Jeff','Days 31–90','In Progress','TECH','IN PROGRESS / NEEDS EVIDENCE ASSEMBLY','Centralize requirements, schema, roles, evidence taxonomy, security baseline, UAT, defects, releases and pilot results.'],['M8','MCENTRIC Team Control Center MVP','Bill','Jeff','Days 1–60','In Progress','BOTH','ALREADY BUILT / ACTIVE BETA','Continue controlled beta; reconcile actual documents/tasks into dashboard; preserve history.'],['M9','Claims & Limitations Matrix','Bill','Jeff','Days 31–90','Not Started','TECH','NEEDS CREATION / COUNSEL REVIEW','Create controlled claim/evidence/prohibited-or-qualified-claim matrix before investor, grant, government or public claims expand.'],['M10','VRF–MCENTRIC Pilot Package','Bill','Jeff','Days 31–90','Not Started','PILOT','FUTURE / BLOCKED BY STRUCTURE + CONTROLS','After Technologies structure and related-party controls, complete pilot agreement, data/security terms, pricing basis and independent VRF approval.'],['M11','Technologies Funding Pipeline','Bill','Jeff','Days 76–120','Not Started','TECH','FUTURE FUNDING READINESS','Populate innovation, R&D, contract, pilot and commercial opportunities with eligibility and bid/no-bid records.'],['M12','Foundation Funding Pipeline','Bill','Jeff','Days 76–120','Not Started','FOUNDATION','FUTURE FUNDING READINESS','After charitable purpose, governance and tax-status path are defensible, qualify charitable/public-benefit opportunities.'],['M13','Funding / Submission / Archive Controls','Jeff','Bill','Days 76–120','Not Started','BOTH','FUTURE CONTROL / NEEDS CREATION','Create applicant-specific archive for exact submissions, budgets, confirmations, contracts, awards and follow-up.'],['M14','Monthly Entity & Intercompany Review','Jeff','Bill','By Day 120','Not Started','BOTH','FUTURE RECURRING CONTROL','Launch monthly review of reconciliations, intercompany items, contracts, conflicts, deadlines, security, releases and pilot exceptions.']].map(x=>({id:x[0],title:x[1],owner:x[2],support:x[3],window:x[4],base:x[5],lane:x[6],mode:x[7],goal:x[8]}));const D=[['MD1','Entity Structure Decision Memo','M1','Bill','master','REVIEW / APPROVE'],['MD2','Formation Instructions to Counsel / CPA','M1','Bill','master','CREATE FROM APPROVED STRUCTURE'],['MD3','Technologies Formation Filing','M2','Jeff','tech','CREATE / OBTAIN'],['MD4','Technologies EIN','M2','Jeff','tech','CREATE / OBTAIN'],['MD5','Technologies Bylaws / Initial Actions','M2','Jeff','tech','CREATE / OBTAIN'],['MD6','Cap Table / Equity Records','M2','Jeff','tech','CREATE / OBTAIN'],['MD7','Foundation Formation Filing','M3','Bill','foundation','CREATE / OBTAIN'],['MD8','Foundation EIN','M3','Jeff','foundation','CREATE / OBTAIN'],['MD9','Foundation Bylaws / Board Actions','M3','Bill','foundation','CREATE / APPROVE'],['MD10','Form 1023 Working Package','M3','Bill','foundation','CREATE / COUNSEL-CPA REVIEW'],['MD11','Technologies Banking / COA Evidence','M4','Jeff','finance','BLOCKED BY FORMATION'],['MD12','Foundation Banking / COA Evidence','M4','Jeff','finance','BLOCKED BY FORMATION'],['MD13','Authorization / Spending Rules','M4','Jeff','finance','CREATE / APPROVE'],['MD14','IP & Brand Register','M5','Bill','ip','ASSEMBLE EXISTING EVIDENCE'],['MD15','Creator / Developer Assignments','M5','Bill','ip','LOCATE / CURE GAPS'],['MD16','Domain / Trademark Ownership File','M5','Bill','ip','ASSEMBLE / COUNSEL REVIEW'],['MD17','Related-Party Policy','M6','Jeff','finance','CREATE / COUNSEL-CPA REVIEW'],['MD18','Intercompany Transaction Register','M6','Jeff','finance','CREATE / MAINTAIN'],['MD19','Recusal / Approval Evidence','M6','Jeff','finance','CREATE / MAINTAIN'],['MD20','Product Validation Dossier','M7','Bill','product','ASSEMBLE EXISTING TECH EVIDENCE'],['MD21','Security / UAT / Release Evidence','M7','Bill','product','ASSEMBLE / VALIDATE'],['MD22','Control Center MVP Evidence','M8','Bill','product','ACTIVE BETA / CAPTURE EVIDENCE'],['MD23','Claims & Limitations Matrix','M9','Bill','product','CREATE / COUNSEL REVIEW'],['MD24','VRF–MCENTRIC Pilot Agreement','M10','Bill','pilot','BLOCKED / FUTURE'],['MD25','Pilot Data / Security Terms','M10','Bill','pilot','BLOCKED / FUTURE'],['MD26','Pilot Pricing / Related-Party Approval','M10','Jeff','pilot','BLOCKED / FUTURE'],['MD27','Technologies Funding Register','M11','Bill','funding','FUTURE FUNDING READINESS'],['MD28','Foundation Funding Register','M12','Bill','funding','FUTURE FUNDING READINESS'],['MD29','Submission / Award Archive','M13','Jeff','funding','CREATE / MAINTAIN']].map(x=>({id:x[0],title:x[1],task:x[2],owner:x[3],folder:x[4],mode:x[5]}));let user=JSON.parse(localStorage.getItem('mcentric_user')||'null'),route=(location.hash||'#home').slice(1),selected=null,meeting=null,pending={};const load=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d)),save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));function ts(){return load('mcentric_task_status',{})}function ds(){return load('mcentric_doc_status',{})}function tasks(){let s=ts();return T.map(t=>({...t,status:s[t.id]||t.base}))}function docs(){let s=ds();return D.map(d=>({...d,...(s[d.id]||{}),status:(s[d.id]||{}).status||'OPEN'}))}function loginKey(e){if(e.key==='Enter'||e.code==='NumpadEnter'||e.keyCode===13){e.preventDefault();doLogin();return false}}function doLogin(){let u=document.getElementById('user').value.trim().toLowerCase(),p=document.getElementById('pass').value;if(USERS[u]&&p===PASS){user={name:USERS[u]};save('mcentric_user',user);location.hash='home';render()}else alert('Use bill or jeff with password mission.')}function logout(){localStorage.removeItem('mcentric_user');user=null;render()}function login(){return `<div class="loginwrap"><div class="login"><div class="gold">INTERNAL ENTITY + FUNDING READINESS</div><h1>MCENTRIC</h1><p class="muted">Technologies + Foundation · Compliance / Governance / Task Center</p><input id="user" placeholder="bill or jeff" autofocus onkeydown="return loginKey(event)"><input id="pass" type="password" placeholder="password" onkeydown="return loginKey(event)"><button class="primary" onclick="doLogin()">ENTER</button><p class="muted">Demo password: mission</p></div></div>`}function nav(){let links=[['home','Mission Control'],['work','My Work'],['docs','Document Center'],['calendar','Calendar / Meetings'],['completed','Completed / History']];return `<aside class="side"><div class="brand">MCENTRIC<small>ENTITY + FUNDING READINESS</small></div><div class="entity"><b>LEGAL LANES</b><div>MCENTRIC Technologies, Inc.</div><div>MCENTRIC Foundation</div><div class="muted">Separate governance, banking, accounting, contracts & funding</div></div><nav class="nav">${links.map(x=>`<a href="#${x[0]}" class="${route===x[0]?'on':''}">${x[1]}</a>`).join('')}</nav><div class="who"><b>${user.name}</b><div class="muted">MCENTRIC Operations</div><button onclick="logout()">Sign out</button></div></aside>`}window.addEventListener('hashchange',()=>{route=(location.hash||'#home').slice(1);selected=null;meeting=null;pending={};render();scrollTo(0,0)});function shell(x){return `<div class="shell">${nav()}<main class="main">${x}</main></div>`}function setTask(id,s){let o=ts();o[id]=s;save('mcentric_task_status',o);render()}function card(t){let n=docs().filter(d=>d.task===t.id&&d.status!=='ACCEPTED').length;return `<div class="task panel" onclick="selected='${t.id}';render()"><i class="bar ${['M1','M2','M3','M4','M6'].includes(t.id)?'crit':''}"></i><div><h3><span class="lane">${t.lane}</span>${t.title}<span class="mode">${t.mode}</span></h3><div class="muted">${t.window} · Owner: ${t.owner} · Support: ${t.support}${n?' · '+n+' evidence item(s) open':''}</div></div><span class="badge">${t.status}</span></div>`}function beginPick(id){let i=document.createElement('input');i.type='file';i.onchange=()=>{let f=i.files&&i.files[0];if(f){pending[id]={name:f.name};render()}};i.click()}function savePending(id){let p=pending[id];if(!p)return;let o=ds();o[id]={...(o[id]||{}),name:p.name,status:'RECEIVED',by:user.name,when:new Date().toISOString()};save('mcentric_doc_status',o);delete pending[id];render()}function cancelPending(id){delete pending[id];render()}function acceptDoc(id){if(!confirm('Accept this evidence as satisfying the requirement?'))return;let o=ds();o[id]={...(o[id]||{}),status:'ACCEPTED',acceptedBy:user.name,acceptedWhen:new Date().toISOString()};save('mcentric_doc_status',o);render()}function req(d){let p=pending[d.id];return `<div class="req"><div><b>${d.title}</b> <span class="mode">${d.mode}</span><div class="muted">${p?'Selected: '+p.name+' · NOT SAVED':(d.name||'No file supplied')+' · '+d.status}</div></div><div class="actions">${p?`<button class="primary" onclick="event.stopPropagation();savePending('${d.id}')">SAVE FILE</button><button class="cancel" onclick="event.stopPropagation();cancelPending('${d.id}')">CANCEL</button>`:`<button class="primary" onclick="event.stopPropagation();beginPick('${d.id}')">${d.name?'REPLACE':'UPLOAD FILE'}</button><a href="${F[d.folder]}" target="_blank">Open Folder</a>${d.name&&d.status!=='ACCEPTED'?`<button onclick="event.stopPropagation();acceptDoc('${d.id}')">Accept</button>`:''}`}</div></div>`}function modal(){if(!selected)return'';let t=T.find(x=>x.id===selected),r=docs().filter(d=>d.task===selected);return `<div class="modalbg" onclick="if(event.target===this){pending={};selected=null;render()}"><div class="modal panel"><button class="close" onclick="pending={};selected=null;render()">×</button><div class="gold">${t.lane} · ${t.id} · ${t.window}</div><h2>${t.title}</h2><div class="goal"><b class="gold">READINESS CLASSIFICATION</b><div>${t.mode}</div><br><b class="gold">NEXT REQUIRED OUTCOME</b><div>${t.goal}</div></div><h3>WHAT WE NEED / EVIDENCE</h3>${r.map(req).join('')||'<div class="empty">No document checklist assigned yet.</div>'}<div class="actions"><button onclick="setTask('${t.id}','IN PROGRESS')">In Progress</button><button onclick="setTask('${t.id}','WAITING')">Waiting</button><button onclick="setTask('${t.id}','BLOCKED')">Blocked</button><button class="primary" onclick="if(confirm('Mark complete?'))setTask('${t.id}','COMPLETE')">Complete</button><button class="cancel" onclick="pending={};selected=null;render()">CANCEL / CLOSE</button></div></div></div>`}function home(){let a=tasks(),open=a.filter(t=>t.status!=='COMPLETE'),need=docs().filter(d=>d.status!=='ACCEPTED'),tech=a.filter(t=>t.lane==='TECH').length,foundation=a.filter(t=>t.lane==='FOUNDATION').length;return shell(`<div class="top"><div><div class="gold">ENTITY + FUNDING READINESS</div><h1>Good afternoon, ${user.name}</h1></div><a href="${SHEET}" target="_blank" class="badge">120-Day Sheet</a></div><div class="metrics"><div class="metric panel"><span class="muted">OPEN TASKS</span><b>${open.length}</b></div><div class="metric panel"><span class="muted">EVIDENCE OPEN</span><b>${need.length}</b></div><div class="metric panel"><span class="muted">TECH TASKS</span><b>${tech}</b></div><div class="metric panel"><span class="muted">FOUNDATION TASKS</span><b>${foundation}</b></div><div class="metric panel"><span class="muted">MEETINGS</span><b>${meets().length}</b></div></div><h2>Readiness Queue</h2><div class="list">${open.map(card).join('')||'<div class="empty">No open work.</div>'}</div>${modal()}`)}function work(){return shell(`<h1>My Work</h1><div class="list">${tasks().filter(t=>t.status!=='COMPLETE').map(card).join('')||'<div class="empty">No open work.</div>'}</div>${modal()}`)}function docview(){return shell(`<h1>Document Center</h1><div class="docs">${docs().map(d=>{let p=pending[d.id];return `<div class="doc panel"><span class="mode">${d.mode}</span><h3>${d.title}</h3><div class="muted">Owner: ${d.owner} · ${p?'Selected: '+p.name+' · NOT SAVED':d.status}</div><div class="actions">${p?`<button class="primary" onclick="savePending('${d.id}')">SAVE FILE</button><button class="cancel" onclick="cancelPending('${d.id}')">CANCEL</button>`:`<button class="primary" onclick="beginPick('${d.id}')">${d.name?'Replace File':'UPLOAD FILE'}</button><a href="${F[d.folder]}" target="_blank">Open Destination Folder</a>${d.name&&d.status!=='ACCEPTED'?`<button onclick="acceptDoc('${d.id}')">Accept</button>`:''}`}</div></div>`}).join('')}</div>`)}function storeM(){return load('mcentric_meet',[])}function meets(){return storeM().filter(m=>m.by===user.name||m.inv.includes(user.name))}function newMeet(){meeting={id:'M'+Date.now(),title:'',date:'',time:'',end:'',location:'',contact:'',email:'',phone:'',purpose:'',notes:'',by:user.name,inv:[user.name],resp:{[user.name]:'ACCEPTED'},new:true};render()}function saveMeet(){let g=id=>document.getElementById(id).value,people=['Bill','Jeff'],inv=people.filter(n=>document.getElementById('i'+n).checked),m={...meeting,title:g('mt'),date:g('md'),time:g('ms'),end:g('me'),location:g('ml'),contact:g('mc'),email:g('mem'),phone:g('mp'),purpose:g('mpr'),notes:g('mn'),inv,new:false};if(!m.title||!m.date||!m.time){alert('Title, date and start time are required.');return}m.resp={...(m.resp||{})};inv.forEach(n=>m.resp[n]=m.resp[n]||'PENDING');let a=storeM(),ix=a.findIndex(x=>x.id===m.id);ix<0?a.push(m):a[ix]=m;save('mcentric_meet',a);meeting=m;render()}function answer(id,r){let a=storeM(),m=a.find(x=>x.id===id);m.resp={...(m.resp||{}),[user.name]:r};save('mcentric_meet',a);meeting=m;render()}function meetModal(){if(!meeting)return'';let m=meeting,people=['Bill','Jeff'];return `<div class="modalbg" onclick="if(event.target===this){meeting=null;render()}"><div class="modal panel"><button class="close" onclick="meeting=null;render()">×</button><h2>${m.new?'Schedule Meeting':m.title}</h2><div class="meetingform"><label class="wide">Meeting / Goal<input id="mt" value="${m.title||''}"></label><label>Date<input type="date" id="md" value="${m.date||''}"></label><label>Start<input type="time" id="ms" value="${m.time||''}"></label><label>End<input type="time" id="me" value="${m.end||''}"></label><label class="wide">Address / Location<input id="ml" value="${m.location||''}"></label><label>Contact<input id="mc" value="${m.contact||''}"></label><label>Email<input id="mem" value="${m.email||''}"></label><label>Phone<input id="mp" value="${m.phone||''}"></label><label class="wide">Purpose / Desired Outcome<textarea id="mpr">${m.purpose||''}</textarea></label><label class="wide">Notes<textarea id="mn">${m.notes||''}</textarea></label><div class="wide">${people.map(n=>`<label><input type="checkbox" id="i${n}" ${m.inv.includes(n)?'checked':''}> Invite ${n}</label>`).join(' ')}</div></div><div class="actions"><button class="primary" onclick="saveMeet()">Save Meeting</button><button class="cancel" onclick="meeting=null;render()">CANCEL / GO BACK</button>${!m.new?`<a href="${F.meet}" target="_blank">Open Meeting Folder</a><button onclick="answer('${m.id}','ACCEPTED')">Accept</button><button onclick="answer('${m.id}','DECLINED')">Decline</button>`:''}</div></div></div>`}function calendar(){let a=meets();return shell(`<div class="top"><h1>Calendar / Meetings</h1><button class="primary" onclick="newMeet()">+ Schedule Meeting</button></div><div class="list">${a.map(m=>`<div class="meet panel" onclick="meeting=storeM().find(x=>x.id==='${m.id}');render()"><div><b>${m.title}</b><div class="muted">MCENTRIC · ${m.date} · ${m.time}${m.location?' · '+m.location:''}</div></div><span class="badge">${(m.resp&&m.resp[user.name])||'PENDING'}</span></div>`).join('')||'<div class="empty">No meetings yet.</div>'}</div>${meetModal()}`)}function completed(){return shell(`<h1>Completed / History</h1><div class="list">${tasks().filter(t=>t.status==='COMPLETE').map(card).join('')||'<div class="empty">No completed tasks yet.</div>'}</div>${modal()}`)}function render(){let a=document.getElementById('app');if(!user){a.innerHTML=login();setTimeout(()=>document.getElementById('user')?.focus(),0);return}let v={home,work,docs:docview,calendar,completed};a.innerHTML=(v[route]||home)()}render();</script></body></html>
