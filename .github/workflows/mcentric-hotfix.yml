name: MCENTRIC hotfix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mcentric-hotfix.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch control center
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mcentric-control-center/index.html')
          s=p.read_text()
          s=s.replace("const USERS={bill:'Bill',jeff:'Jeff'}", "const USERS={'bill@mcentricnow.org':'Bill','jeff@mcentricnow.org':'Jeff'}")
          s=s.replace("else alert('Use bill or jeff with password mission.')", "else alert('Incorrect email or password.')")
          s=s.replace('placeholder="bill or jeff"', 'placeholder="Email address"')
          s=s.replace('<p class="muted">Demo password: mission</p>', '')
          s=s.replace('id="mt" value=', 'id="mt" placeholder="e.g., weekly MCENTRIC working meeting" value=')
          s=s.replace('id="ml" value=', 'id="ml" placeholder="e.g., Zoom or meeting location" value=')
          s=s.replace('id="mc" value=', 'id="mc" placeholder="e.g., Bill, Jeff" value=')
          s=s.replace('id="mem" value=', 'id="mem" placeholder="e.g., name@mcentricnow.org" value=')
          s=s.replace('id="mp" value=', 'id="mp" placeholder="e.g., phone number" value=')
          s=s.replace('id="mpr">', 'id="mpr" placeholder="e.g., purpose or desired outcome">')
          s=s.replace('id="mn">', 'id="mn" placeholder="e.g., notes or follow-up items">')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'MCENTRIC Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add mcentric-control-center/index.html
          git diff --cached --quiet || git commit -m 'Refine Mission Control login and input guidance'
          git push
