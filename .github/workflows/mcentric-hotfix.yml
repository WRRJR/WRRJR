name: MCENTRIC hotfix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mcentric-hotfix.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch control center auth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mcentric-control-center/index.html')
          s=p.read_text()
          s=s.replace("const USERS={'bill@mcentricnow.org':'Bill','jeff@mcentricnow.org':'Jeff'},PASS='mission';", "const USERS={'bill@mcentricnow.org':'Bill','jeff@mcentricnow.org':'Jeff'};")
          old="function doLogin(){let u=document.getElementById('user').value.trim().toLowerCase(),p=document.getElementById('pass').value;if(USERS[u]&&p===PASS){user={name:USERS[u]};save('mcentric_user',user);location.hash='home';render()}else alert('Incorrect email or password.')}"
          new="async function doLogin(){let u=document.getElementById('user').value.trim().toLowerCase(),p=document.getElementById('pass').value;try{let r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:u,password:p})});let d=await r.json();if(r.ok&&d.ok){user={name:d.name};save('mcentric_user',user);location.hash='home';render()}else alert('Incorrect email or password.')}catch(e){alert('Login unavailable. Please try again.')}}"
          if old not in s: raise SystemExit('Expected login function not found')
          s=s.replace(old,new)
          s=s.replace('id="user" placeholder="Email address"', 'id="user" type="email" autocomplete="username" placeholder="Email address"')
          s=s.replace('id="pass" type="password" placeholder="password"', 'id="pass" type="password" autocomplete="current-password" placeholder="Password"')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'MCENTRIC Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add mcentric-control-center/index.html
          git diff --cached --quiet || git commit -m 'Wire Mission Control login to server auth'
          git push
